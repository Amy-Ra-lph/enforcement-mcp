---
# AWX + EDA + aap-mcp-server demo stack
# Usage: podman-compose up -d
# AWX UI: http://localhost:8080  (admin / password)
# aap-mcp-server: http://localhost:3000/mcp

services:
  postgres:
    image: docker.io/library/postgres:15
    environment:
      POSTGRES_USER: awx
      POSTGRES_PASSWORD: awxpass
      POSTGRES_DB: awx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awx"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  awx-web:
    image: quay.io/ansible/awx:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8052"
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: awx
      DATABASE_USER: awx
      DATABASE_PASSWORD: awxpass
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      AWX_ADMIN_USER: admin
      AWX_ADMIN_PASSWORD: password
    volumes:
      - awx_projects:/var/lib/awx/projects
    command: >
      bash -c "
        awx-manage migrate --noinput &&
        awx-manage create_preload_data ||true &&
        echo 'from django.contrib.auth.models import User; User.objects.filter(username=\"admin\").exists() or User.objects.create_superuser(\"admin\", \"admin@localhost\", \"password\")' | awx-manage shell &&
        /usr/bin/launch_awx.sh
      "

  awx-task:
    image: quay.io/ansible/awx:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_HOST: postgres
      DATABASE_NAME: awx
      DATABASE_USER: awx
      DATABASE_PASSWORD: awxpass
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      AWX_SKIP_MIGRATIONS: "1"
    volumes:
      - awx_projects:/var/lib/awx/projects
    command: >
      bash -c "
        /usr/bin/launch_awx_task.sh
      "

  aap-mcp-server:
    image: docker.io/library/node:22-slim
    depends_on:
      - awx-web
    ports:
      - "3000:3000"
    environment:
      BASE_URL: "http://awx-web:8052"
      MCP_PORT: "3000"
      BEARER_TOKEN_OAUTH2_AUTHENTICATION: ""
      ALLOW_WRITE_OPERATIONS: "true"
    volumes:
      - ./aap-mcp.yaml:/app/aap-mcp.yaml:ro
      - aap_mcp_node:/app/node_modules
    working_dir: /app
    command: >
      bash -c "
        if [ ! -d /app/aap-mcp-server ]; then
          git clone https://github.com/ansible/aap-mcp-server.git /app/aap-mcp-server
        fi
        cd /app/aap-mcp-server &&
        npm install &&
        npm run build &&
        npm start
      "

volumes:
  pgdata:
  awx_projects:
  aap_mcp_node:
