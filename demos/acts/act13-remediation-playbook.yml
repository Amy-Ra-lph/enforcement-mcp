settings:
  title: "Act 13 — Remediation Playbook Generator (enforcement-mcp)"
  width: 110
  height: 40
  prompt: "$ "
  type_speed: 0.035

instructions:
  - type: marker
    label: "Tier 2: Remediation Playbook Generator"

  - type: comment
    text: "Tool: generate_playbook — Ansible playbooks using linux-system-roles"
    pause_after: 2.5

  - type: comment
    text: "Read-only: returns YAML text, never executes. Ranked by risk score."
    pause_after: 2.0

  - type: command
    run: |-
      # Generate remediation for httpd_t → user_home_t denial
      python3 -c "
      import json
      print(json.dumps({
          'finding_type': 'denial',
          'total_options': 3,
          'recommended': {
              'strategy': 'relabel',
              'scope': 'narrowest — fixes one file, no policy change',
              'risk': {'risk_score': 0, 'risk_level': 'low', 'recommendation': 'proceed'},
          },
          'alternatives': [
              {'strategy': 'relabel', 'risk': {'risk_score': 0, 'risk_level': 'low'}},
              {'strategy': 'custom_module', 'risk': {'risk_score': 5, 'risk_level': 'low'}},
              {'strategy': 'boolean', 'boolean': 'httpd_read_user_content',
               'risk': {'risk_score': 18, 'risk_level': 'low'}},
          ]
      }, indent=2))
      "
    output: |
      {
        "finding_type": "denial",
        "total_options": 3,
        "recommended": {
          "strategy": "relabel",
          "scope": "narrowest — fixes one file, no policy change",
          "risk": {
            "risk_score": 0,
            "risk_level": "low",
            "recommendation": "proceed"
          }
        },
        "alternatives": [
          {"strategy": "relabel", "risk": {"risk_score": 0, "risk_level": "low"}},
          {"strategy": "custom_module", "risk": {"risk_score": 5, "risk_level": "low"}},
          {"strategy": "boolean", "boolean": "httpd_read_user_content",
           "risk": {"risk_score": 18, "risk_level": "low"}}
        ]
      }
    pause_after: 4.0

  - type: comment
    text: "Each alternative includes a complete Ansible playbook:"
    pause_after: 1.5

  - type: command
    run: |-
      # Show the recommended playbook (relabel)
      python3 -c "
      print('''# Remediation: Relabel /home/user/public_html to expected context
      # Risk: low (0/100) — proceed
      # Generated by enforcement-mcp — review before applying
      ---
      - name: Relabel /home/user/public_html for httpd_t access
        hosts: '{{ target_hosts }}'
        become: true
        roles:
        - role: fedora.linux_system_roles.selinux
          vars:
            selinux_restore_dirs:
            - /home/user/public_html''')
      "
    output: |
      # Remediation: Relabel /home/user/public_html to expected context
      # Risk: low (0/100) — proceed
      # Generated by enforcement-mcp — review before applying
      ---
      - name: Relabel /home/user/public_html for httpd_t access
        hosts: '{{ target_hosts }}'
        become: true
        roles:
        - role: fedora.linux_system_roles.selinux
          vars:
            selinux_restore_dirs:
            - /home/user/public_html
    pause_after: 4.0

  - type: comment
    text: "4 finding types: denial, file_context, fapolicyd_block, aide_change"
    pause_after: 2.0

  - type: comment
    text: "Uses fedora.linux_system_roles — no custom Ansible. Human reviews before applying."
    pause_after: 2.0

  - type: comment
    text: "Tier 2: read-only output. Safe for linux-mcp upstream contribution."
    pause_after: 2.0
