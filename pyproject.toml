[project]
name = "enforcement-mcp"
version = "0.1.0"
description = "SELinux, fapolicyd, and MLS policy intelligence MCP server for LLM agents"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Amy Ralph" }
]
readme = "README.md"
keywords = ["mcp", "selinux", "fapolicyd", "mls", "security", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = [
    "fastmcp>=2.0,<4.0",
    "paramiko>=3.0,<4.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
identity = [
    "pyjwt[crypto]>=2.8,<3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyjwt[crypto]>=2.8,<3.0",
]

[project.scripts]
enforcement-mcp = "enforcement_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enforcement_mcp"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"src/enforcement_mcp/server.py" = ["E501"]
"src/enforcement_mcp/risk.py" = ["S108"]
"tests/**" = ["S101", "S105", "S106", "S108", "E501"]
"src/enforcement_mcp/ssh.py" = ["S507", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
